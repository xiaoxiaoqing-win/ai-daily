name: Daily Digest
on:
  schedule:
    # 00:17 UTC = 08:17 Asia/Shanghai. Off the hour to reduce scheduling congestion.
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# Both generation workflows serialize writes to the generated JSON.
concurrency:
  group: content-generation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and generate daily digest
        run: python -m pipeline collect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      - name: Commit generated content
        if: success() || failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/index.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: update daily digest'
            git pull --rebase
            git push
          fi
  # GITHUB_TOKEN commits do not trigger push workflows. Call deployment explicitly.
  publish:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    uses: ./.github/workflows/pages.yml

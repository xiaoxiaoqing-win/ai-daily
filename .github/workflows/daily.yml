name: Daily Digest
on:
  schedule:
    # Beijing: primary 08:17; catch-up checks at 08:47, 09:17 and 10:17.
    # Each run checks the latest default branch before any collection/model call.
    - cron: "17 0-2 * * *"
    - cron: "47 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新生成当天日报（可能再次消耗 API 额度）"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
# Both generation workflows serialize writes to the generated JSON.
concurrency:
  group: content-generation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      should_collect: ${{ steps.guard.outputs.should_collect }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check whether today's digest already exists
        id: guard
        run: python -m pipeline.schedule
        env:
          FORCE_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.should_collect == 'true'
      - name: Collect and generate daily digest
        if: steps.guard.outputs.should_collect == 'true'
        run: python -m pipeline collect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
      - name: Commit generated content
        if: (success() || failure()) && steps.guard.outputs.should_collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/index.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: update daily digest'
            git pull --rebase
            git push
          fi
  # GITHUB_TOKEN commits do not trigger push workflows. Call deployment explicitly.
  publish:
    needs: collect
    if: >-
      always() && needs.collect.result != 'cancelled' &&
      needs.collect.outputs.should_collect == 'true'
    uses: ./.github/workflows/pages.yml

name: Deep Research
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      topic:
        description: "调研主题"
        required: true
        type: string
      urls:
        description: "来源链接，每行一个，最多 8 个"
        type: string
      notes:
        description: "补充原文或视频转录（将在报告中引用）"
        type: string
      web_search:
        description: "使用 Tavily 补充联网检索"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: content-generation
  cancel-in-progress: false
jobs:
  research:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[Research]') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify task author's write permission
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.issue.user.login
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              throw new Error('Only repository owners and write collaborators may run research.');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate research report
        # User input stays in env/event JSON and is never interpolated into shell code.
        run: |
          if [ "$TASK_EVENT" = 'issues' ]; then
            python -m pipeline research --event-file "$GITHUB_EVENT_PATH"
          else
            python -m pipeline research
          fi
        env:
          TASK_EVENT: ${{ github.event_name }}
          RESEARCH_TOPIC: ${{ inputs.topic }}
          RESEARCH_URLS: ${{ inputs.urls }}
          RESEARCH_NOTES: ${{ inputs.notes }}
          RESEARCH_WEB_SEARCH: ${{ inputs.web_search }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Commit research
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/index.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: publish research report'
            git pull --rebase
            git push
          fi
  publish:
    needs: research
    if: needs.research.result == 'success'
    uses: ./.github/workflows/pages.yml
